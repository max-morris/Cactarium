# Local development on top of compose.yaml: dev sign-in, local demo repos, fast polling.
services:
  app:
    environment:
      CACTARIUM_BASE_URL: http://localhost:${PORT:-8000}
      CACTARIUM_DEV_LOGIN: "1"
      CACTARIUM_ALLOW_LOCAL_REPOS: "1"
      CACTARIUM_POLL_SECONDS: "60"
      # Small, so the smoke test sees examining a repo's tags take several syncs.
      CACTARIUM_EXAMINE_PER_SYNC: "25"
      CACTARIUM_SUPERADMIN: ${CACTARIUM_SUPERADMIN:-dev:max}
    volumes:
      # The demo repos sit at the same absolute path inside and outside the container, so their
      # file:// URLs work for the server and for a cactup on the host alike.
      - ./demo/repos:${DEMO_REPOS:-/repos}:ro
      - ./demo/files:/demo:ro
