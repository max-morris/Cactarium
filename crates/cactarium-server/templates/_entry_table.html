<div class="table-box">
<table>
  <thead><tr><th scope="col">Name</th><th scope="col">Kind</th><th scope="col">Latest</th><th scope="col">Summary</th><th scope="col"><span class="sr-only">Saves</span></th></tr></thead>
  <tbody>
  {% for r in rows %}
    <tr>
      <td><a class="mono strong" href="{{ r.url }}">{{ r.slug }}</a>
        {% if r.verified %}<span class="badge good">verified</span>{% endif %}
        {% if r.curated %}<span class="badge quiet">curated</span>{% endif %}
        {% if r.visibility != "public" %}<span class="badge warn">{{ r.visibility }}</span>{% endif %}</td>
      <td>{{ r.kind }}</td>
      <td class="mono">{{ r.latest }}</td>
      <td class="muted">{{ r.summary }}</td>
      <td class="small muted heart-count" title="Saved by {{ r.hearts }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6C19 16.5 12 21 12 21z"/></svg> {{ r.hearts }}</td>
    </tr>
  {% else %}
    <tr><td colspan="5" class="muted">Nothing here yet.</td></tr>
  {% endfor %}
  </tbody>
</table>
</div>
