[package]
name = "cactarium-server"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/max-morris/Cactarium"
description = "The Cactarium registry: thorn packages, stacks and sim files for the Cactup ecosystem"

[[bin]]
name = "cactarium"
path = "src/main.rs"

[dependencies]
cactup-ecosystem-common = { git = "https://github.com/max-morris/cactup-ecosystem-common", rev = "145959d092f1a4292d2b8cd65ca3ff56610b2118" }
ammonia = "4.2"
anyhow = "1.0.102"
askama = "0.16"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
hex = "0.4"
hmac = "0.12"
regex = "1.13"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "time", "json"] }
subtle = "2.6"
tempfile = "3.27"
thiserror = "2.0"
time = { version = "0.3.41", features = ["formatting", "macros", "serde"] }
tokio = { version = "1", features = ["full"] }
toml = "1.1.2"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "limit", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

[dev-dependencies]
